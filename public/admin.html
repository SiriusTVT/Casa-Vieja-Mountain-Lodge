<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de administración | Casa Vieja</title>
  <link rel="stylesheet" href="/admin.css">
  <style>.payment-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:15px;border-top:1px solid rgba(38,53,43,.14)}.payment-actions button{padding:10px 12px;font-size:10px}.payment-link-result{color:#8a7355;font:11px Arial,sans-serif}.quote-cancel{background:#9d332c}.quote-delete{background:#5b2622}.quote-confirm{background:#5e7655}</style>
</head>
<body>
  <main class="admin-shell">
    <div class="admin-brand">Casa Vieja <span>Panel privado</span></div>
    <section class="admin-card" id="auth-card">
      <p class="eyebrow">Acceso restringido</p>
      <h1 id="auth-title">Iniciar sesión</h1>
      <p id="auth-description">Administra las solicitudes de cotización del lodge.</p>
      <form id="auth-form">
        <label for="username">Usuario</label><input id="username" name="username" required autocomplete="username">
        <label for="password">Contraseña</label><input id="password" name="password" type="password" required autocomplete="current-password">
        <button type="submit" id="auth-submit">Iniciar sesión</button>
      </form>
      <button class="text-button" type="button" id="toggle-setup">Primer registro de administrador</button>
      <p class="status" id="auth-status" role="status"></p>
    </section>
    <section class="dashboard" id="dashboard" hidden>
         <header class="dashboard-header"><div><p class="eyebrow">Panel privado</p><h1>Cotizaciones</h1></div><div class="dashboard-actions"><button id="refresh-quotes" type="button">Actualizar</button><button id="logout">Cerrar sesión</button></div></header>
      <div class="admin-tabs"><button type="button" class="admin-tab is-active" data-admin-tab="quotes">Cotizaciones</button><button type="button" class="admin-tab" data-admin-tab="products">Productos</button></div>
      <section class="admin-panel" id="quotes-panel">
        <div class="dashboard-meta" id="dashboard-meta"></div>
        <div class="quotes" id="quotes"></div>
      </section>
      <section class="admin-panel" id="products-panel" hidden>
        <div class="products-header"><div><p class="eyebrow">Catálogo</p><h2>Gestionar productos</h2></div><button type="button" id="new-product">Agregar producto</button></div>
        <p class="status" id="products-status" role="status"></p>
        <form class="product-form" id="product-form" hidden>
          <input type="hidden" id="product-id">
          <label for="product-name">Nombre</label><input id="product-name" required>
          <label for="product-description">Descripción</label><textarea id="product-description" rows="3" required></textarea>
          <label for="product-image-file">Imagen principal desde tu equipo</label><input id="product-image-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml">
          <label for="product-image">Ruta o URL de imagen principal (opcional si seleccionas un archivo)</label><input id="product-image" placeholder="/Productos/imagen.jpeg">
          <label for="product-stock">Stock</label><input id="product-stock" type="number" min="0" step="1" required>
          <label class="checkbox-label"><input id="product-available" type="checkbox" checked> Disponible en el catálogo</label>
          <label class="checkbox-label"><input id="product-has-variants" type="checkbox"> Este producto tiene variedades</label>
          <div class="variants-editor" id="variants-editor" hidden>
            <div class="variants-editor-header"><span>Variedades</span><button type="button" class="secondary-button" id="add-variant">Agregar variedad</button></div>
            <div id="variant-rows"></div>
          </div>
          <div class="form-actions"><button type="submit">Guardar producto</button><button type="button" class="secondary-button" id="cancel-product">Cancelar</button></div>
        </form>
        <div class="admin-products" id="admin-products"></div>
      </section>
    </section>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
